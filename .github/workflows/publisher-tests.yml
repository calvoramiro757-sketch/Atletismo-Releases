name: Test controlled publisher

on:
  pull_request:
    paths:
      - '.github/workflows/publish-atletismo-release.yml'
      - '.github/workflows/publisher-tests.yml'
      - 'scripts/**'
      - 'tests/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-atletismo-release.yml'
      - '.github/workflows/publisher-tests.yml'
      - 'scripts/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.js
      - run: node --check scripts/publisher-policy.js
      - run: node --check scripts/publisher-check.js
