name: Test controlled publisher

on:
  pull_request:
    paths:
      - '.github/workflows/publish-atletismo-release.yml'
      - '.github/workflows/publisher-tests.yml'
      - 'scripts/**'
      - 'tests/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-atletismo-release.yml'
      - '.github/workflows/publisher-tests.yml'
      - 'scripts/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run publisher regression tests
        shell: bash
        run: |
          AAPT_TOOL="${ANDROID_SDK_ROOT:?}/build-tools/35.0.0/aapt"
          test -x "$AAPT_TOOL"
          export AAPT_TOOL
          node --test tests/*.test.js
      - run: node --check scripts/publisher-policy.js
      - run: node --check scripts/publisher-check.js
      - run: node --check scripts/apk-inspection.js
      - run: node --check tests/publisher.test.js
      - name: Check committed diff
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "origin/$GITHUB_BASE_REF"...HEAD
          else
            git diff --check HEAD^ HEAD
          fi
      - name: Verify and run actionlint v1.7.12
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          curl -fLsS --retry 0 --max-time 60 "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" -o "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/publish-atletismo-release.yml .github/workflows/publisher-tests.yml
