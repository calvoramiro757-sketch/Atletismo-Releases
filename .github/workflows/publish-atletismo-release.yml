name: Publish controlled Atletismo release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, for example 3.4.4'
        required: true
        type: string
      source_sha:
        description: 'Full audited source commit SHA in calvoramiro757-sketch/Atletismo'
        required: true
        type: string
      signed_run_id:
        description: 'Successful signed build workflow run id'
        required: true
        type: string
      artifact_id:
        description: 'Exact artifact id from that signed run'
        required: true
        type: string
      apk_sha256:
        description: 'Expected SHA-256 for Atletismo-release.apk'
        required: true
        type: string
      update_json_sha256:
        description: 'Expected SHA-256 for update.json'
        required: true
        type: string
      metadata_source_sha:
        description: 'Source commit for final changelog; empty means signed source SHA'
        required: false
        type: string
      artifact_update_sha256:
        description: 'Signed artifact metadata hash; empty means final update.json hash'
        required: false
        type: string
      dry_run:
        description: 'Validate only; true unless separately authorized to publish'
        required: true
        default: true
        type: boolean
      publish_confirm:
        description: 'True only after explicit authorization for this specific release'
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: controlled-atletismo-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate candidate without release write access
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-release
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_REPO: calvoramiro757-sketch/Atletismo
      RELEASES_REPO: calvoramiro757-sketch/Atletismo-Releases
      VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      SIGNED_RUN_ID: ${{ inputs.signed_run_id }}
      ARTIFACT_ID: ${{ inputs.artifact_id }}
      APK_SHA256: ${{ inputs.apk_sha256 }}
      UPDATE_JSON_SHA256: ${{ inputs.update_json_sha256 }}
      METADATA_SOURCE_SHA: ${{ inputs.metadata_source_sha || inputs.source_sha }}
      ARTIFACT_UPDATE_SHA256: ${{ inputs.artifact_update_sha256 || inputs.update_json_sha256 }}
      DRY_RUN: ${{ inputs.dry_run }}
      PUBLISH_CONFIRM: ${{ inputs.publish_confirm }}
    steps:
      - name: Require trusted main workflow and explicit flags
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "$RELEASES_REPO" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$RELEASES_REPO/.github/workflows/publish-atletismo-release.yml@refs/heads/main" ]]
          [[ "$VERSION" =~ ^(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})$ ]]
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SIGNED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$APK_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$UPDATE_JSON_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$METADATA_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$ARTIFACT_UPDATE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          if [[ "$DRY_RUN" != "true" && "$PUBLISH_CONFIRM" != "true" ]]; then
            echo "Publication requires explicit confirmation" >&2
            exit 1
          fi

      - name: Checkout trusted publisher only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact signed run, attempt, artifact and audited workflow blob
        env:
          GH_TOKEN: ${{ secrets.ATLETISMO_SOURCE_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "Missing source read token" >&2; exit 1; }
          gh api "repos/$SOURCE_REPO/actions/runs/$SIGNED_RUN_ID" > "$RUNNER_TEMP/run.json"
          attempt=$(jq -er '.run_attempt | select(type == "number" and . >= 1 and . <= 1000)' "$RUNNER_TEMP/run.json")
          gh api "repos/$SOURCE_REPO/actions/runs/$SIGNED_RUN_ID/attempts/$attempt/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          gh api "repos/$SOURCE_REPO/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/artifact.json"
          gh api "repos/$SOURCE_REPO/contents/.github/workflows/build-release-apk.yml?ref=$SOURCE_SHA" --jq '.sha' > "$RUNNER_TEMP/workflow-blob.txt"
          node scripts/publisher-check.js evidence "$RUNNER_TEMP/run.json" "$RUNNER_TEMP/jobs.json" "$RUNNER_TEMP/artifact.json" "$RUNNER_TEMP/workflow-blob.txt" "$SOURCE_SHA" "$SIGNED_RUN_ID" "$ARTIFACT_ID" "$RUNNER_TEMP/artifact-digest.txt"

      - name: Download and hash exact signed artifact archive
        env:
          GH_TOKEN: ${{ secrets.ATLETISMO_SOURCE_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$SOURCE_REPO/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/source-artifact.zip"
          echo "$(cat "$RUNNER_TEMP/artifact-digest.txt")  $RUNNER_TEMP/source-artifact.zip" | sha256sum -c -
          unzip -Z1 "$RUNNER_TEMP/source-artifact.zip" > "$RUNNER_TEMP/zip-entries.txt"
          node scripts/publisher-check.js zip-entries "$RUNNER_TEMP/zip-entries.txt"
          mkdir dist
          unzip -qq "$RUNNER_TEMP/source-artifact.zip" -d dist
          node scripts/publisher-check.js files dist "$VERSION" "$APK_SHA256" "$ARTIFACT_UPDATE_SHA256"

      - name: Verify exact historical V3.4.4 tag before metadata repair
        if: inputs.version == '3.4.4'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$RELEASES_REPO/git/ref/tags/v$VERSION" > "$RUNNER_TEMP/recovery-tag.json"
          node scripts/publisher-check.js recovery-tag "$RUNNER_TEMP/recovery-tag.json"

      - name: Verify structured Stable source and prepare final metadata
        env:
          GH_TOKEN: ${{ secrets.ATLETISMO_SOURCE_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$SOURCE_REPO/contents/docs/changelog/$VERSION.md?ref=$METADATA_SOURCE_SHA" --jq '.content' | base64 -d > "$RUNNER_TEMP/stable-changelog.md"
          candidate_tag_sha="$GITHUB_SHA"
          if [[ "$VERSION" == "3.4.4" ]]; then
            candidate_tag_sha=$(jq -er '.object.sha' "$RUNNER_TEMP/recovery-tag.json")
          fi
          node scripts/publisher-check.js prepare-metadata dist "$RUNNER_TEMP/stable-changelog.md" "$VERSION" "$SOURCE_SHA" "$METADATA_SOURCE_SHA" "$SIGNED_RUN_ID" "$ARTIFACT_ID" "$candidate_tag_sha" "$APK_SHA256" "$ARTIFACT_UPDATE_SHA256" "$UPDATE_JSON_SHA256"
          node scripts/publisher-check.js files dist "$VERSION" "$APK_SHA256" "$UPDATE_JSON_SHA256"

      - name: Inspect signed APK identity from its real bytes
        shell: bash
        run: |
          set -euo pipefail
          tools="${ANDROID_SDK_ROOT:?}/build-tools/35.0.0"
          test -x "$tools/aapt"
          test -x "$tools/apksigner"
          "$tools/apksigner" verify --verbose dist/Atletismo-release.apk
          node scripts/publisher-check.js certificate dist/Atletismo-release.apk "$tools/apksigner"
          node scripts/publisher-check.js apk dist/Atletismo-release.apk dist/update.json "$VERSION" "$tools/aapt"

      - name: Verify public Stable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$RELEASES_REPO/releases/latest" > "$RUNNER_TEMP/latest.json"
          stable_tag=$(jq -er '.tag_name | select(test("^v(0|[1-9][0-9]{0,5})\\.(0|[1-9][0-9]{0,5})\\.(0|[1-9][0-9]{0,5})$"))' "$RUNNER_TEMP/latest.json")
          curl -fLsS --retry 0 --max-time 30 "https://github.com/$RELEASES_REPO/releases/download/$stable_tag/update.json" -o "$RUNNER_TEMP/stable-update.json"
          node scripts/publisher-check.js stable "$RUNNER_TEMP/latest.json" "$RUNNER_TEMP/stable-update.json" dist/update.json

      - name: Dry run ends without publication
        if: inputs.dry_run == true
        run: echo "All checks passed. Dry run made no release or tag."

      - name: Transfer validated candidate to the separate publisher job
        if: inputs.dry_run == false
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validated-release-candidate
          path: |
            dist/Atletismo-release.apk
            dist/update.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish only after validation and environment approval
    if: inputs.dry_run == false
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-release
    permissions:
      contents: write
      actions: read
    env:
      RELEASES_REPO: calvoramiro757-sketch/Atletismo-Releases
      SOURCE_REPO: calvoramiro757-sketch/Atletismo
      VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      SIGNED_RUN_ID: ${{ inputs.signed_run_id }}
      ARTIFACT_ID: ${{ inputs.artifact_id }}
      APK_SHA256: ${{ inputs.apk_sha256 }}
      UPDATE_JSON_SHA256: ${{ inputs.update_json_sha256 }}
      METADATA_SOURCE_SHA: ${{ inputs.metadata_source_sha || inputs.source_sha }}
      ARTIFACT_UPDATE_SHA256: ${{ inputs.artifact_update_sha256 || inputs.update_json_sha256 }}
      PUBLISH_CONFIRM: ${{ inputs.publish_confirm }}
    steps:
      - name: Require main and explicit publication authorization
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "$RELEASES_REPO" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$RELEASES_REPO/.github/workflows/publish-atletismo-release.yml@refs/heads/main" ]]
          [[ "$PUBLISH_CONFIRM" == "true" ]]

      - name: Checkout trusted publisher only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download validated files from this workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: validated-release-candidate
          path: dist

      - name: Revalidate files, APK identity and certificate without GitHub credentials
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publisher-check.js files dist "$VERSION" "$APK_SHA256" "$UPDATE_JSON_SHA256"
          tools="${ANDROID_SDK_ROOT:?}/build-tools/35.0.0"
          test -x "$tools/aapt"
          test -x "$tools/apksigner"
          "$tools/apksigner" verify --verbose dist/Atletismo-release.apk
          node scripts/publisher-check.js certificate dist/Atletismo-release.apk "$tools/apksigner"
          node scripts/publisher-check.js apk dist/Atletismo-release.apk dist/update.json "$VERSION" "$tools/aapt"

      - name: Revalidate current public Stable and authenticated draft state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$RELEASES_REPO/releases/latest" > "$RUNNER_TEMP/latest.json"
          stable_tag=$(jq -er '.tag_name | select(test("^v(0|[1-9][0-9]{0,5})\\.(0|[1-9][0-9]{0,5})\\.(0|[1-9][0-9]{0,5})$"))' "$RUNNER_TEMP/latest.json")
          curl -fLsS --retry 0 --max-time 30 "https://github.com/$RELEASES_REPO/releases/download/$stable_tag/update.json" -o "$RUNNER_TEMP/stable-update.json"
          node scripts/publisher-check.js stable "$RUNNER_TEMP/latest.json" "$RUNNER_TEMP/stable-update.json" dist/update.json
          node scripts/publisher-transaction.js inspect dist

      - name: Resume exact draft, verify asset bytes and publish Stable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publisher-transaction.js publish dist

      - name: Verify public final state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publisher-transaction.js inspect dist
          gh api "repos/$RELEASES_REPO/releases/latest" > "$RUNNER_TEMP/public.json"
          node scripts/publisher-check.js release "$RUNNER_TEMP/public.json" "$VERSION" "$APK_SHA256" "$UPDATE_JSON_SHA256" false
